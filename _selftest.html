<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>selftest</title></head>
<body>
<main>
<section class="view" id="view-home"></section>
</main>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/grammar.js"></script>
<script>
/* Build a minimal DOM replica of index.html so app.js can wire up */
document.body.innerHTML = `
<header class="site-header">
  <nav id="main-nav">${['home','alphabet','vowels','numbers','words','grammar','phrases','quiz'].map(r=>'<button data-route="'+r+'">'+r+'</button>').join('')}</nav>
  <button id="theme-btn"></button>
</header>
<p class="hero-hello" id="hero-greeting"></p>
<div class="bar-fill" id="overall-bar"></div><span id="overall-pct"></span>
<span id="stat-letters"></span><div id="stat-letters-bar" class="bar-fill"></div>
<span id="stat-words"></span><div id="stat-words-bar" class="bar-fill"></div>
<span id="stat-quiz"></span><div id="stat-quiz-bar" class="bar-fill"></div>
<p id="tip-text"></p>
<input type="search" id="alpha-search"><div id="alpha-filters">
  ${['all','todo','learned','joiners','non'].map(f=>'<button class="chip" data-filter="'+f+'">'+f+'</button>').join('')}
</div><span id="alpha-count"></span><div id="alpha-grid"></div>
<div id="marks-grid"></div><div id="long-grid"></div>
<label for="vowel-base"></label><select id="vowel-base"></select><div id="vowel-grid"></div>
<div id="numbers-grid"></div>
<div id="word-cats"></div><span id="cat-progress-label"></span><div id="cat-progress-bar" class="bar-fill gold"></div>
<div id="deck-area">
  <div id="flashcard"><span id="fc-cat-front"></span><span id="fc-ar"></span><span id="fc-tr"></span><span id="fc-cat-back"></span><span id="fc-en"></span></div>
  <button id="fc-prev"></button><button id="fc-flip"></button><button id="fc-next"></button>
  <button id="fc-shuffle"></button><button id="fc-star"></button>
  <button id="btn-deck-view"></button><button id="btn-list-view"></button>
</div>
<div id="words-list"></div>
<div id="grammar-list"></div>
<div id="phrases-list"></div><div id="dialogue"></div><button id="play-dialogue"></button>
<div id="quiz-setup"><div id="quiz-topics">
  ${['mixed','letters','vocab','numbers'].map(t=>'<button class="chip" data-topic="'+t+'">'+t+'</button>').join('')}
</div><button id="btn-start-quiz"></button></div>
<div id="quiz-play"><span id="q-progress"></span><span id="q-score"></span><div id="q-bar" class="bar-fill accent"></div>
  <div id="q-question"></div><div id="q-options"></div><div id="q-feedback"></div><button id="btn-next-q"></button></div>
<div id="quiz-result"><div id="score-ring"><span id="qr-score"></span></div><p id="qr-msg"></p><p id="qr-best"></p>
  <button id="btn-again"></button><button id="btn-change-topic"></button></div>
<button id="reset-progress"></button>
<div id="modal-overlay"><div class="modal"><button id="modal-close"></button><div id="modal-body"></div>
  <button id="modal-prev"></button><button id="modal-star"></button><button id="modal-next"></button></div></div>
<div id="toast"></div>`;
</script>
<script src="js/app.js"></script>
<script>
const R = {errors:[], pass:0, fail:0};
window.onerror = (msg, src, line) => { R.errors.push(msg + ' @' + (src||'') + ':' + line); return false; };
function T(name, cond){ cond ? R.pass++ : (R.fail++, R.errors.push('FAIL: ' + name)); }
try {
  T('28 letters', LETTERS.length === 28);
  T('unique letters', new Set(LETTERS.map(l=>l.ch)).size === 28);
  T('forms derived', LETTERS.every(l => l.forms && l.forms.iso));
  T('non-joiners correct', ['ا','د','ذ','ر','ز','و'].every(ch => { const l = LETTERS.find(x=>x.ch===ch); return l && !l.joins && l.forms.ini === ch; }));
  T('joiner medial', (()=>{ const b = LETTERS.find(x=>x.ch==='ب'); return b.forms.med.indexOf('\u0640') === 0 && b.forms.med.lastIndexOf('\u0640') === 2; })());
  T('12 word decks', WORDS.length === 12);
  T('word total >100', WORD_TOTAL > 100);
  T('15 grammar lessons', GRAMMAR.length === 15);
  T('13 numbers', NUMBERS.length === 13);
  T('sun/moon cover 28', SUN_LETTERS.length === 14 && MOON_LETTERS.length === 14 &&
      new Set([...SUN_LETTERS, ...MOON_LETTERS]).size === 28);

  /* rendered UI */
  T('alphabet grid has 28 cards', document.querySelectorAll('#alpha-grid .letter-card').length === 28);
  T('marks rendered', document.querySelectorAll('#marks-grid .mark-card').length >= 6);
  T('combos rendered', document.querySelectorAll('#combo-grid, #vowel-grid .combo-card').length === 7);
  T('numbers rendered', document.querySelectorAll('#numbers-grid .num-card').length === 13);
  T('cat chips', document.querySelectorAll('#word-cats .chip').length === 12);
  T('card filled', document.getElementById('fc-ar').textContent.length > 0);
  T('grammar lessons', document.querySelectorAll('#grammar-list .lesson').length === 15);
  T('phrase rows', document.querySelectorAll('#phrases-list .phrase-row').length > 30);
  T('dialogue bubbles', document.querySelectorAll('#dialogue .bubble').length === 5);
  T('home stats filled', /\d+\/28/.test(document.getElementById('stat-letters').textContent));

  /* interactions */
  document.querySelector('#alpha-filters .chip[data-filter="learned"]').click();
  T('filter learned empty initially', document.querySelectorAll('#alpha-grid .letter-card').length === 0);
  document.querySelector('#alpha-filters .chip[data-filter="all"]').click();
  document.querySelector('.letter-card').click();
  T('modal opens', !document.getElementById('modal-overlay').classList.contains('hidden'));
  T('modal body injected', document.getElementById('modal-body').innerHTML.includes('form-cell'));
  document.getElementById('modal-star').click();
  T('star marks letter', Object.keys(progress.letters).length === 1);
  T('learned filter now 1', (()=>{ document.querySelector('#alpha-filters .chip[data-filter="learned"]').click();
      const n = document.querySelectorAll('#alpha-grid .letter-card').length;
      document.querySelector('#alpha-filters .chip[data-filter="all"]').click(); return n === 1; })());
  document.getElementById('modal-close').click();
  T('modal closes', document.getElementById('modal-overlay').classList.contains('hidden'));

  /* words */
  document.getElementById('fc-next').click();
  T('next word changes card', true);
  document.getElementById('fc-star').click();
  T('word starred', Object.keys(progress.words).length === 1);
  document.getElementById('fc-shuffle').click();
  T('shuffle keeps deck size', deckOrder.length === WORDS[catIdx].items.length);
  document.getElementById('btn-list-view').click();
  T('list view rows', document.querySelectorAll('#words-list .word-row').length > 5);
  document.getElementById('btn-deck-view').click();

  /* vowel explorer */
  const sel = document.getElementById('vowel-base');
  sel.value = '1'; sel.dispatchEvent(new Event('change'));
  T('explorer re-renders', document.getElementById('vowel-grid').textContent.includes('ba'));

  /* quiz engine */
  document.getElementById('btn-start-quiz').click();
  T('quiz starts', !document.getElementById('quiz-play').classList.contains('hidden'));
  T('10 questions generated', quiz.qs.length === 10);
  T('options are 4', quiz.qs.every(q => q.options.length === 4));
  T('answer always among options', quiz.qs.every(q => q.options.some(o => o.label === q.answer)));
  T('no duplicate options', quiz.qs.every(q => new Set(q.options.map(o=>o.label)).size === 4));
  const rightIdx = quiz.qs[0].options.findIndex(o => o.label === quiz.qs[0].answer);
  document.querySelectorAll('#q-options .opt')[rightIdx].click();
  T('correct answer scores', quiz.score === 1);
  T('feedback shown', document.getElementById('q-feedback').textContent.length > 3);
  for (let k = 1; k < 10; k++){ document.getElementById('btn-next-q').click();
    const qi = quiz.qs[quiz.idx].options.findIndex(o => o.label === quiz.qs[quiz.idx].answer);
    document.querySelectorAll('#q-options .opt')[qi].click(); }
  document.getElementById('btn-next-q').click();
  T('finish shows result', !document.getElementById('quiz-result').classList.contains('hidden'));
  T('score 100 saved', progress.quizBest.mixed === 100);
  T('ring pct set', document.getElementById('score-ring').style.getPropertyValue('--pct') === '100%');

  /* routing */
  location.hash = '#alphabet';
  window.dispatchEvent(new HashChangeEvent('hashchange'));
  T('route switches view', document.getElementById('view-alphabet').classList.contains('active'));
} catch(e){ R.errors.push('EXCEPTION: ' + e.message); }

/* beam results back through the dev server's access log */
const payload = encodeURIComponent(JSON.stringify(R));
new Image().src = '/__beacon?p=' + payload;
setTimeout(() => new Image().src = '/__beacon2?p=' + payload, 1500);
</script>
</body></html>
